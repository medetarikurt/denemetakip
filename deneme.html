<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deneme Takip</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#667085;--line:#dfe3ea;--acc:#1f5fbf;--ok:#1b7f4b;--bad:#c23b32;--warn:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212b;--ink:#e8ecf2;--mut:#9aa5b5;--line:#2b3340;--acc:#6ea4f4;--ok:#4cc38a;--bad:#f27c73;--warn:#e0b04f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px 40px}
main{max-width:640px;margin:0 auto}
h1{font-size:22px;margin:8px 0 12px}h2{font-size:17px;margin:0 0 8px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
button,input{font:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 14px;margin:4px 6px 4px 0}
button.s{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.5}
input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right}
.m{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.q{border-top:1px solid var(--line);padding:10px 0}.q b{margin-right:6px}
.seg button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 14px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#msg{position:sticky;top:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Deneme takip</h1>
<div id="msg" role="status"></div>

<section id="girisBox">
  <p class="m">Devam etmek için Google ile giriş yap.</p>
  <button id="girisBtn">Google ile giriş yap</button>
</section>

<div id="app" hidden>
<section>
  <h2>1. Yeni deneme</h2>
  <input type="text" id="ad" placeholder="Deneme adı (örn. 5. Cilt 3. Deneme)">
  <p class="m">Deneme sayfalarının fotoğraflarını seç (en fazla 14).</p>
  <input type="file" id="dosya" accept="image/*" multiple>
  <p class="m" id="dosyaSay"></p>
  <button id="okuBtn" disabled>Fotoğraftan oku</button>
</section>

<section id="supheBox" hidden>
  <h2>2. Şüpheli sorular</h2>
  <p class="m" id="supheOzet"></p>
  <div id="supheList"></div>
  <details><summary>Rastgele 10 "kesin" soruyu kontrol et</summary><div id="kontrolList"></div></details>
  <button id="hesapBtn">Hesapla ve kaydet</button>
</section>

<section id="sonucBox" hidden>
  <h2>3. Sonuç</h2>
  <div id="sonuc"></div>
  <button id="etiketBtn">Yanlışlara konu etiketi ekle</button>
  <div id="etiketSonuc"></div>
</section>

<section>
  <h2>Geçmiş ve trend</h2>
  <button class="s" id="gecmisBtn">Denemeleri yükle</button>
  <div id="trend"></div>
</section>
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script>
// TODO: Firebase konsolundan Proje ayarları > Web uygulaması yapılandırmasını yapıştır.
const firebaseConfig = {
  apiKey: "", authDomain: "", projectId: "", appId: ""
};
// Ders aralıkları. Klinik kısım 5. Cilt 3. Deneme fotoğraflarından taslak; kitabına göre düzelt.
const SABLON = [
  ["Anatomi",1,13],["Fizyoloji",14,28],["Biyokimya",29,46],["Mikrobiyoloji",47,64],["Patoloji",65,82],["Farmakoloji",83,100],
  ["Dahiliye",101,135],["Pediatri",136,161],["Genel Cerrahi + Küçük Stajlar",162,190],["Kadın Doğum",191,200]
];
const TOPLAM = 200;

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const fn = firebase.app().functions("europe-west1").httpsCallable("analyzeExam", { timeout: 300000 });
const $ = (id) => document.getElementById(id);
let S = { files: [], items: {}, final: {}, docId: null, wrong: [] };

function msg(t, err) { const m = $("msg"); m.textContent = t; m.style.display = t ? "block" : "none"; m.style.color = err ? "var(--bad)" : "var(--ink)"; }
function derse(no) { const s = SABLON.find((x) => no >= x[1] && no <= x[2]); return s ? s[0] : "Diğer"; }
const col = () => db.collection("users").doc(auth.currentUser.uid).collection("denemeler");

$("girisBtn").onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch((e) => msg(e.message, 1));
auth.onAuthStateChanged((u) => { $("app").hidden = !u; $("girisBox").hidden = !!u; });

async function kucult(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.8).split(",")[1];
}
async function gorseller() { return Promise.all(S.files.map(kucult)); }

$("dosya").onchange = (e) => {
  S.files = [...e.target.files].slice(0, 14);
  $("dosyaSay").textContent = S.files.length + " fotoğraf seçildi";
  $("okuBtn").disabled = !S.files.length;
};

$("okuBtn").onclick = async () => {
  if (!$("ad").value.trim()) return msg("Önce deneme adını yaz.", 1);
  $("okuBtn").disabled = true; msg("Okunuyor, 1-2 dakika sürebilir...");
  try {
    const r = await fn({ mode: "read", images: await gorseller() });
    S.items = {}; S.final = {};
    r.data.items.forEach((x) => { if (x.no >= 1 && x.no <= TOPLAM) S.items[x.no] = x; });
    for (let n = 1; n <= TOPLAM; n++) {
      if (!S.items[n]) S.items[n] = { no: n, r: "B", c: "suphe", note: "fotoğraflarda bulunamadı" };
      if (S.items[n].c === "kesin") S.final[n] = S.items[n].r;
    }
    msg(""); supheCiz();
  } catch (e) { msg("Hata: " + (e.message || e), 1); }
  $("okuBtn").disabled = false;
};

function segHtml(n) {
  return `<span class="seg" data-n="${n}">` + [["D", "Doğru"], ["Y", "Yanlış"], ["B", "Boş"]]
    .map(([k, t]) => `<button class="${S.final[n] === k ? "on" : ""}" data-k="${k}">${t}</button>`).join("") + "</span>";
}
function satir(n, ek) {
  const x = S.items[n];
  return `<div class="q"><b>${n}.</b><span class="m">${derse(n)}${ek && x.note ? " · " + x.note : ""}</span><br>${segHtml(n)}</div>`;
}
function supheCiz() {
  const sup = Object.values(S.items).filter((x) => x.c !== "kesin").map((x) => x.no).sort((a, b) => a - b);
  const kes = Object.values(S.items).filter((x) => x.c === "kesin").map((x) => x.no);
  const rnd = kes.sort(() => Math.random() - 0.5).slice(0, 10).sort((a, b) => a - b);
  $("supheBox").hidden = false;
  $("supheOzet").textContent = `${kes.length} soru kesin, ${sup.length} soru şüpheli. Şüphelileri sen belirle.`;
  $("supheList").innerHTML = sup.map((n) => satir(n, 1)).join("") || '<p class="m">Şüpheli soru yok.</p>';
  $("kontrolList").innerHTML = rnd.map((n) => satir(n, 0)).join("");
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".seg button"); if (!b) return;
  const n = +b.parentElement.dataset.n; S.final[n] = b.dataset.k;
  [...b.parentElement.children].forEach((c) => c.classList.toggle("on", c === b));
});

function hesapla() {
  const tab = SABLON.map(([ders, a, b]) => {
    let d = 0, y = 0, bos = 0;
    for (let n = a; n <= b; n++) { const r = S.final[n]; if (r === "D") d++; else if (r === "Y") y++; else bos++; }
    return { ders, d, y, bos, net: d - y / 4 };
  });
  const top = (f) => tab.slice(f[0], f[1]).reduce((s, t) => ({ d: s.d + t.d, y: s.y + t.y, bos: s.bos + t.bos, net: s.net + t.net }), { d: 0, y: 0, bos: 0, net: 0 });
  return { tab, temel: top([0, 6]), klinik: top([6, 10]) };
}
function tabloHtml(h) {
  const row = (n, t, b) => `<tr><td>${b ? "<b>" + n + "</b>" : n}</td><td class="n ok">${t.d}</td><td class="n bad">${t.y}</td><td class="n">${t.bos}</td><td class="n"><b>${t.net.toFixed(2)}</b></td></tr>`;
  return `<table><tr><th>Ders</th><th class="n">D</th><th class="n">Y</th><th class="n">B</th><th class="n">Net</th></tr>` +
    h.tab.map((t) => row(t.ders, t)).join("") + row("Temel", h.temel, 1) + row("Klinik", h.klinik, 1) +
    row("Toplam", { d: h.temel.d + h.klinik.d, y: h.temel.y + h.klinik.y, bos: h.temel.bos + h.klinik.bos, net: h.temel.net + h.klinik.net }, 1) + "</table>";
}

$("hesapBtn").onclick = async () => {
  const bekleyen = Object.keys(S.final).length;
  if (bekleyen < TOPLAM && !confirm((TOPLAM - bekleyen) + " soru hâlâ belirlenmedi, boş sayılacak. Devam?")) return;
  const h = hesapla();
  S.wrong = []; const sonuc = {};
  for (let n = 1; n <= TOPLAM; n++) { sonuc[n] = S.final[n] || "B"; if (sonuc[n] === "Y") S.wrong.push(n); }
  try {
    const ref = await col().add({ ad: $("ad").value.trim(), tarih: firebase.firestore.FieldValue.serverTimestamp(), sonuc, ozet: h, etiketler: {} });
    S.docId = ref.id; msg("Kaydedildi.");
  } catch (e) { return msg("Kayıt hatası: " + e.message, 1); }
  $("sonucBox").hidden = false; $("sonuc").innerHTML = tabloHtml(h);
};

$("etiketBtn").onclick = async () => {
  if (!S.docId || !S.wrong.length) return msg("Etiketlenecek yanlış yok.", 1);
  $("etiketBtn").disabled = true; msg("Konular çıkarılıyor...");
  try {
    const r = await fn({ mode: "tag", images: await gorseller(), wrong: S.wrong });
    const et = {}; r.data.items.forEach((x) => (et[x.no] = { ders: x.ders, konu: x.konu, c: x.c }));
    await col().doc(S.docId).update({ etiketler: et });
    const sup = r.data.items.filter((x) => x.c !== "kesin").length;
    $("etiketSonuc").innerHTML = `<p class="m">${r.data.items.length} yanlış etiketlendi (${sup} şüpheli konu).</p><table>` +
      r.data.items.map((x) => `<tr><td>${x.no}</td><td>${x.ders}</td><td>${x.konu}${x.c !== "kesin" ? ' <span class="warn">?</span>' : ""}</td></tr>`).join("") + "</table>";
    msg("");
  } catch (e) { msg("Hata: " + (e.message || e), 1); }
  $("etiketBtn").disabled = false;
};

$("gecmisBtn").onclick = async () => {
  msg("Yükleniyor...");
  const snap = await col().orderBy("tarih", "asc").limitToLast(20).get();
  const dn = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  msg("");
  if (!dn.length) return ($("trend").innerHTML = '<p class="m">Henüz deneme yok.</p>');
  let html = "<table><tr><th>Deneme</th><th class='n'>Temel</th><th class='n'>Klinik</th></tr>" +
    dn.map((d) => `<tr><td>${d.ad}</td><td class="n">${d.ozet.temel.net.toFixed(1)}</td><td class="n">${d.ozet.klinik.net.toFixed(1)}</td></tr>`).join("") + "</table>";
  // Konu bazlı yanlış sayısı (denemelere göre)
  const m = {};
  dn.forEach((d, i) => Object.values(d.etiketler || {}).forEach((x) => {
    const k = x.ders + " / " + x.konu; (m[k] = m[k] || new Array(dn.length).fill(0))[i]++;
  }));
  const son = dn.length, tekrar = [], duzel = [];
  Object.entries(m).forEach(([k, a]) => {
    const toplam = a.reduce((s, v) => s + v, 0), son3 = a.slice(-3).filter((v) => v > 0).length;
    if (son3 >= 2) tekrar.push([k, toplam]);
    else if (son >= 4 && a.slice(0, -2).reduce((s, v) => s + v, 0) >= 2 && a.slice(-2).every((v) => !v)) duzel.push([k, toplam]);
  });
  const liste = (a) => a.sort((x, y) => y[1] - x[1]).map(([k, t]) => `<li>${k} <span class="m">(${t} yanlış)</span></li>`).join("") || '<li class="m">Yok</li>';
  html += `<h2 style="margin-top:14px">Tekrar eden konular</h2><p class="m">Son 3 denemenin en az 2'sinde yanlış.</p><ul>${liste(tekrar)}</ul>` +
    `<h2>Düzelmiş olabilir</h2><p class="m">Önceden en az 2 yanlış, son 2 denemede yanlış yok. Konudan o denemede soru çıkmamış da olabilir.</p><ul>${liste(duzel)}</ul>`;
  $("trend").innerHTML = html;
};
</script>
</body>
</html>
